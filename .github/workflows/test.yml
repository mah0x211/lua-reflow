name: test

on:
    push:
        paths-ignore:
            - '**.md'
            - 'LICENSE'

jobs:
  luacheck:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mah0x211/lua-ci:latest
    steps:
    -
      name: Checkout
      uses: actions/checkout@v2
      with:
        submodules: 'true'
    -
      name: Install Tools
      run: luarocks install luacheck
    -
      name: Run luacheck
      run: |
        luacheck .

  static-checks:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mah0x211/lua-ci:latest
    steps:
    -
      name: Checkout
      uses: actions/checkout@v2
      with:
        submodules: 'true'
    -
      name: Set Up LLVM
      uses: ./.github/actions/setup-llvm
    -
      name: Install Dependencies
      run: |
        luarocks make --only-deps rockspecs/reflow-scm-1.rockspec
    -
      name: Check C Formatting
      run: |
        clang-format --version
        clang-format --dry-run --Werror src/*.c src/*.h
    -
      name: Check Compiler Warnings and Static Analysis
      run: |
        INC=$(luarocks config variables.LUA_INCDIR)
        ERRNO_INC="$(luarocks show --rock-dir errno)/conf"
        ISYSTEM="-isystem $INC -isystem $ERRNO_INC -isystem deps/yyjson/src -isystem deps/lexbor/source"
        clang --version
        gcc --version
        status=0
        for src in src/*.c; do
          gcc -std=c99 -fsyntax-only @config/gcc/warnings.rsp $ISYSTEM -Isrc "$src" || status=1
          clang -std=c99 -fsyntax-only --config=config/clang/warnings.cfg $ISYSTEM -Isrc "$src" || status=1
          clang --analyze -Xanalyzer -analyzer-werror -std=c99 $ISYSTEM -Isrc "$src" -o /dev/null || status=1
        done
        exit $status

  test:
    needs: luacheck
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mah0x211/lua-ci:latest
    strategy:
      matrix:
        lua-version:
          - "5.1.:latest"
          - "5.2.:latest"
          - "5.3.:latest"
          - "5.4.:latest"
          - "lj-v2.1:latest"
    steps:
    -
      name: Switch Lua Version
      run: |
        lenv -g use ${{ matrix.lua-version }}
        lua -v || true
    -
      name: Checkout
      uses: actions/checkout@v2
      with:
        submodules: 'true'
    -
      name: Install Test Dependencies
      run: |
        luarocks test --prepare rockspecs/reflow-scm-1.rockspec
    -
      name: Install
      run: |
        luarocks make
    -
      name: Run Test
      run: |
        luarocks test rockspecs/reflow-scm-1.rockspec
    -
      name: Upload coverage to Codecov
      if: ${{ hashFiles('luacov.report.out') != '' }}
      uses: codecov/codecov-action@v5
      with:
        use_oidc: true
        disable_search: true
        files: ./luacov.report.out
        flags: unittests
