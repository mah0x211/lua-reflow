# Explicit C diagnostics checked with -Werror by the static-checks CI job.

# Diagnostic policy and C conformance
-Werror
-pedantic-errors
-fno-common
-Wstrict-prototypes
-Wmissing-declarations
-Wimplicit-function-declaration
-Wimplicit-int
-Wgnu-folding-constant
-Wvla

# Conversions and numeric operations
-Wconversion
-Wsign-conversion
-Wconstant-conversion
-Wenum-conversion
-Wenum-enum-conversion
-Wdouble-promotion
-Wfloat-equal
-Wshift-count-negative
-Wshift-count-overflow
-Wshift-negative-value
-Wcast-align
-Wcast-qual
-Wincompatible-function-pointer-types
-Wwrite-strings
-Wignored-qualifiers

# Comparisons, branches and control flow
-Wsign-compare
-Wtautological-compare
-Wtautological-bitwise-compare
-Wtautological-constant-in-range-compare
-Wtautological-overlap-compare
-Wtautological-type-limit-compare
-Wimplicit-fallthrough
-Wswitch
-Wswitch-enum
-Wparentheses
-Wempty-body
-Wmisleading-indentation
-Wfor-loop-analysis
-Winfinite-recursion
-Wunreachable-code
-Wself-assign

# Initialization and unused code
-Wuninitialized
-Wconditional-uninitialized
-Wmissing-field-initializers
-Winitializer-overrides
-Wmissing-braces
-Wunused-function
-Wunused-variable
-Wunused-parameter
-Wunused-but-set-variable
-Wunused-but-set-parameter
-Wunused-label
-Wunused-local-typedefs
-Wunused-result
-Wunused-value
-Wshadow

# Arrays, pointers and memory operations
-Warray-bounds
-Warray-parameter
-Wchar-subscripts
-Wpointer-arith
-Wpointer-sign
-Wnonnull
-Wnull-dereference
-Wnull-pointer-arithmetic
-Wnull-pointer-subtraction
-Wsizeof-array-argument
-Wsizeof-array-decay
-Wsizeof-pointer-memaccess

# Formatting, literals and preprocessing
-Wformat=2
-Wformat-pedantic
-Wunterminated-string-initialization
-Wstring-concatenation
-Wstring-conversion
-Wmultichar
-Wtrigraphs
-Wcomment
-Wundef
-Wunknown-pragmas
-Wextra-semi
-Wint-in-bool-context
-Wreturn-type
